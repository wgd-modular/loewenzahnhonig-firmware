name: Build Firmwares (reusable)

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""
      attach-to-release:
        required: false
        type: boolean
        default: false
      publish-to-pages:
        required: false
        type: boolean
        default: false
      tag-name:
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "12.2.Rel1"

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Set up DaisyDuino board support
        run: |
          arduino-cli config init --additional-urls https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
          arduino-cli core update-index
          arduino-cli core install STMicroelectronics:stm32
          arduino-cli lib install DaisyDuino

      - name: Build libraries
        run: ./build_libs.sh

      - name: Build firmwares
        run: python3 ./build_firmwares.py

      - name: Collect binaries
        run: |
          mkdir -p artifacts
          find src -type f -name '*.bin' -path '*/build/*' -exec cp {} artifacts/ \;

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmwares-${{ github.sha }}
          path: artifacts/*.bin
          if-no-files-found: error

      - name: Attach firmwares to release
        if: ${{ inputs.attach-to-release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag-name }}
          files: artifacts/*.bin

      - name: Publish firmwares to GitHub Pages
        if: ${{ inputs.publish-to-pages }}
        env:
          TAG: ${{ inputs.tag-name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          mkdir -p "/tmp/gh-pages/firmwares/$TAG"
          cp artifacts/*.bin "/tmp/gh-pages/firmwares/$TAG/"
          cd /tmp/gh-pages
          git add "firmwares/$TAG"
          if git diff --cached --quiet; then
            echo "No firmware changes to publish"
          else
            git commit -m "chore: publish firmware binaries for $TAG"
            git push origin HEAD:gh-pages
          fi
