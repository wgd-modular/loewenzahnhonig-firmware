name: Build Firmwares (reusable)

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""
      attach-to-release:
        required: false
        type: boolean
        default: false
      publish-to-pages:
        required: false
        type: boolean
        default: false
      tag-name:
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.72.2
          cache: true

      - name: Build firmwares
        run: pixi run build

      - name: Collect binaries
        run: |
          mkdir -p artifacts
          find src -type f -name '*.bin' -path '*/build/*' -exec cp {} artifacts/ \;

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmwares-${{ github.sha }}
          path: artifacts/*.bin
          if-no-files-found: error

      - name: Attach firmwares to release
        if: ${{ inputs.attach-to-release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag-name }}
          files: artifacts/*.bin

      - name: Publish firmwares to GitHub Pages
        if: ${{ inputs.publish-to-pages }}
        env:
          TAG: ${{ inputs.tag-name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          mkdir -p "/tmp/gh-pages/firmwares/$TAG"
          cp artifacts/*.bin "/tmp/gh-pages/firmwares/$TAG/"
          cd /tmp/gh-pages
          git add "firmwares/$TAG"
          if git diff --cached --quiet; then
            echo "No firmware changes to publish"
          else
            git commit -m "chore: publish firmware binaries for $TAG"
            git push origin HEAD:gh-pages
          fi
